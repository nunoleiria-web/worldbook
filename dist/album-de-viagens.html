<title>Álbum de Viagens</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: capa de correio aéreo no topo, separadores (mapa, viagens, ano, fotos), página de viagem com diário por dia. */
:root {
  --bg: #F4F1EA;
  --surface: #FBF9F4;
  --ink: #1B1917;
  --ink-2: #6B655B;
  --line: #DAD4C7;
  --hover: #EAE5D9;
  --accent: #B4472A;
  --on-accent: #FFFFFF;
  --blue: #2D4B73;
  --stripe-a: #C8341B;
  --stripe-b: #1F3F9E;
  --sea: #E1E9E7;
  --land: #FFFFFF;
  --coast: #A5B5B1;
  --grat: #CFDAD7;
  --scrim: rgb(8 12 11 / 0.94);
  --scrim-ink: #EEF2F0;
  --display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "DM Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131211; --surface: #1C1B19; --ink: #EDEAE3; --ink-2: #A09A8E; --line: #302E2A;
    --hover: #262522; --accent: #E58A62; --on-accent: #1B0A05; --blue: #9DB4D8;
    --stripe-a: #E2543A; --stripe-b: #4A6BE0;
    --sea: #131E1C; --land: #22322E; --coast: #3B4F4A; --grat: #1C2A27; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131211; --surface: #1C1B19; --ink: #EDEAE3; --ink-2: #A09A8E; --line: #302E2A;
  --hover: #262522; --accent: #E58A62; --on-accent: #1B0A05; --blue: #9DB4D8;
  --stripe-a: #E2543A; --stripe-b: #4A6BE0;
  --sea: #131E1C; --land: #22322E; --coast: #3B4F4A; --grat: #1C2A27; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--body); margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
img { display: block; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.airmail { display: none;
  
  height: 10px;
  background: repeating-linear-gradient(-45deg,
    var(--stripe-a) 0 14px, var(--bg) 14px 22px, var(--stripe-b) 22px 36px, var(--bg) 36px 44px);
}
.wrap {
  max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 96px;
}

.mono { font-family: var(--mono); font-size: 0.8rem; letter-spacing: 0.02em; color: var(--ink-2); }
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 24px; margin-bottom: 22px; }
.top > div { min-width: 0; }
h1 { font: 400 clamp(2.8rem, 9vw, 5rem)/0.95 var(--display); letter-spacing: -0.02em; margin: 0 0 12px; text-wrap: balance; }
h2.year { font: 500 0.9rem var(--mono); letter-spacing: 0.08em; color: var(--ink-2); margin: 0 0 16px; display: flex; align-items: center; gap: 14px; }
h2.year::after { content: ""; flex: 1; height: 1px; background: var(--line); }
h2.sec { font: 400 1.7rem/1.2 var(--display); margin: 0 0 14px; letter-spacing: -0.01em; }
h3 { font: 400 1.5rem/1.15 var(--display); margin: 0; letter-spacing: -0.01em; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0.55rem 1.2rem; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--ink); background: transparent; font-weight: 600; font-size: 0.95rem;
}
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.quiet { border-color: var(--line); }
.btn.danger { border-color: var(--accent); color: var(--accent); }
.btn.sm { min-height: 36px; padding: 0.3rem 0.8rem; font-size: 0.85rem; }
.btn[disabled] { opacity: 0.5; cursor: default; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* separadores */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 26px; overflow-x: auto; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px 9px; cursor: pointer; font: 600 0.95rem var(--body); color: var(--ink-2); min-height: 44px; white-space: nowrap; margin-bottom: -1px; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

/* barra de filtros */
.bar { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; margin-bottom: 22px; }
.search { flex: 1 1 220px; min-width: 0; }
.input { width: 100%; min-height: 44px; padding: 0.55rem 0.7rem; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--ink); }
.surface .input { background: var(--bg); }
textarea.input { min-height: 96px; resize: vertical; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 12px; font: 500 0.82rem var(--mono); cursor: pointer; min-height: 32px; color: var(--ink-2); }
.chip:hover { background: var(--hover); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.static { cursor: default; }
.chip.static:hover { background: transparent; }

/* viagens */
.years { display: flex; flex-direction: column; gap: 44px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 30px 22px; }
.card { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.cover { position: relative; aspect-ratio: 4 / 3; width: 100%; overflow: hidden; border-radius: 10px; border: 1px solid var(--line); background: var(--hover); }
.cover img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
.card:hover .cover img { transform: scale(1.03); }
.cover.ph { display: flex; align-items: flex-end; padding: 14px; color: #fff; border-color: transparent; }
.cover.ph span { font: 500 0.85rem var(--mono); letter-spacing: 0.04em; opacity: 0.92; }
.heart { position: absolute; top: 8px; right: 8px; background: rgb(8 12 11 / 0.55); color: #fff; border-radius: 999px; width: 28px; height: 28px; display: grid; place-items: center; font-size: 0.95rem; }
.card p { margin: 0; }
.card .place { color: var(--ink-2); }
.card .mono { margin-top: 2px; }
.tagline { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.tagline span { font: 500 0.72rem var(--mono); color: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }

.timeline { position: relative; display: flex; flex-direction: column; gap: 28px; padding-left: 22px; border-left: 2px solid var(--line); margin-left: 6px; }
.tl-item { position: relative; display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 20px; align-items: start; }
.tl-item::before { content: ""; position: absolute; left: -30px; top: 8px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 3px solid var(--bg); }
.tl-item .body { min-width: 0; display: grid; gap: 4px; }
.tl-item .body p { margin: 0; color: var(--ink-2); max-width: 60ch; overflow-wrap: anywhere; }
.tl-item .body .clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

.memory { border: 1px solid var(--line); border-left: 4px solid var(--blue); background: var(--surface); border-radius: 4px; padding: 14px 16px; margin-bottom: 26px; display: grid; gap: 10px; }
.memory h2 { font: 400 1.05rem var(--display); margin: 0; }
.memory .thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
.memory .thumbs button { width: 84px; height: 64px; padding: 0; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; cursor: pointer; background: var(--hover); }
.memory .thumbs img { width: 100%; height: 100%; object-fit: cover; }

.empty { border: 1px dashed var(--ink-2); border-radius: 4px; padding: 44px 24px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; max-width: 680px; }
.empty h2 { font: 400 2.2rem/1.1 var(--display); margin: 0; text-wrap: balance; }
.empty p { margin: 0; color: var(--ink-2); max-width: 54ch; }

/* mapa */
.mapbox { position: relative; width: 100%; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--sea); user-select: none; -webkit-user-select: none; }
.mapbox svg { display: block; width: 100%; height: auto; touch-action: pan-y; cursor: default; }
.mapbox.zoomed svg { touch-action: none; cursor: grab; }
.mapbox.dragging svg { cursor: grabbing; }
.mapbox.pick svg { cursor: crosshair; }
.mapctl { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 6px; }
.mapctl button { width: 38px; height: 38px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 4px; cursor: pointer; font: 600 1.1rem var(--body); }
.mapctl button:hover { background: var(--hover); }
.pin { cursor: pointer; }
.pin:focus-visible { outline: none; }
.pin:focus-visible circle.ring { stroke: var(--blue); stroke-width: 3; }
.mapnote { display: grid; gap: 18px; margin-top: 18px; }
.sel { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; align-items: center; border: 1px solid var(--line); border-radius: 4px; padding: 12px; background: var(--surface); }
.sel .cover { aspect-ratio: 4 / 3; }
.sel > div { min-width: 0; display: grid; gap: 4px; justify-items: start; }
.sel p { margin: 0; }
.nolocs { color: var(--ink-2); font-size: 0.95rem; }
.nolocs button { background: none; border: 0; border-bottom: 1px solid var(--ink-2); padding: 0; cursor: pointer; color: var(--ink); }

/* ano */
.yearbar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.yearbar h2 { font: 700 2rem/1 var(--display); margin: 0; min-width: 4ch; text-align: center; }
.months { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 24px 20px; }
.month h3 { font: 500 0.8rem var(--mono); letter-spacing: 0.06em; color: var(--ink-2); text-transform: uppercase; margin: 0 0 8px; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal .wd { font: 500 0.65rem var(--mono); color: var(--ink-2); text-align: center; }
.cal .d { aspect-ratio: 1; display: grid; place-items: center; font: 400 0.72rem var(--mono); border-radius: 3px; color: var(--ink-2); border: 0; background: transparent; padding: 0; }
.cal button.d { cursor: pointer; color: #fff; font-weight: 500; }
.cal button.d:hover { filter: brightness(1.12); }
.legend { margin-top: 26px; display: grid; gap: 8px; }
.legend button { display: flex; gap: 12px; align-items: baseline; background: none; border: 0; padding: 6px 0; text-align: left; cursor: pointer; border-bottom: 1px solid var(--line); }
.legend i { width: 12px; height: 12px; border-radius: 3px; flex: none; transform: translateY(1px); }

/* fotos */
.wall { column-width: 210px; column-gap: 14px; }
.wall figure { break-inside: avoid; margin: 0 0 14px; position: relative; }
.photo { display: block; width: 100%; padding: 0; border: 1px solid var(--line); border-radius: 3px; background: var(--hover); cursor: zoom-in; overflow: hidden; }
.photo img { width: 100%; height: auto; }
.wall figcaption { font: 400 0.8rem/1.35 var(--mono); color: var(--ink-2); padding-top: 6px; overflow-wrap: anywhere; }
.wall .heart { pointer-events: none; }
.month-h { font: 500 0.85rem var(--mono); letter-spacing: 0.06em; color: var(--ink-2); text-transform: uppercase; margin: 26px 0 12px; }
.month-h:first-child { margin-top: 0; }
.drop { border: 1px dashed var(--ink-2); border-radius: 4px; padding: 36px 20px; display: grid; gap: 12px; justify-items: start; max-width: 640px; }
.drop.over, .wall.over { outline: 2px dashed var(--blue); outline-offset: 6px; }
.drop p { margin: 0; color: var(--ink-2); }

/* viagem */
.back { background: none; border: 0; padding: 8px 0; cursor: pointer; font: 500 0.85rem var(--mono); color: var(--ink-2); margin-bottom: 14px; min-height: 44px; }
.back:hover { color: var(--ink); }
.trip-head { display: grid; gap: 14px; margin-bottom: 28px; }
.trip-head .where { font: 500 1.15rem var(--display); color: var(--ink-2); margin: 0; }
.trip-head .note { max-width: 62ch; margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.trip-mini { max-width: 640px; margin-bottom: 34px; }
.days { display: grid; gap: 34px; }
.day { display: grid; gap: 12px; }
.day-h { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.day-h b { font: 400 1.5rem/1 var(--display); }
.day textarea { min-height: 72px; max-width: 70ch; }
.day .txt { margin: 0; max-width: 70ch; white-space: pre-wrap; overflow-wrap: anywhere; }
.day .wall { column-width: 160px; column-gap: 10px; }
.day .wall figure { margin-bottom: 10px; }
.day.empty-day { gap: 6px; }
.day.empty-day .day-h b { font: 500 0.95rem var(--display); color: var(--ink-2); }

.status {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  z-index: 90; max-width: calc(100% - 32px);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 4px;
  font: 500 0.85rem var(--mono); box-shadow: 0 6px 24px rgb(0 0 0 / 0.25);
}

/* janelas */
.backdrop {
  position: fixed; inset: 0; z-index: 60; background: var(--scrim); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.panel { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; width: 100%; max-width: 560px; max-height: 100%; overflow: auto; padding: 24px; }
.panel.wide { max-width: 720px; }
.panel h2 { font: 700 1.6rem/1.1 var(--display); margin: 0 0 18px; letter-spacing: -0.015em; }
.panel p.help { margin: 0 0 14px; color: var(--ink-2); font-size: 0.95rem; }
form { display: grid; gap: 14px; }
.f { display: grid; gap: 5px; min-width: 0; }
.f label { font: 500 0.78rem var(--mono); letter-spacing: 0.04em; color: var(--ink-2); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.err { color: var(--accent); font-size: 0.9rem; margin: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; margin-top: 6px; }
.locrow { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.proposal { border: 1px solid var(--line); border-radius: 4px; padding: 14px; display: grid; gap: 10px; margin-bottom: 12px; }
.proposal.off { opacity: 0.55; }
.proposal .head { display: flex; gap: 12px; align-items: center; }
.proposal .head input[type="checkbox"] { width: 20px; height: 20px; flex: none; }
.proposal .thumbs { display: flex; gap: 6px; overflow-x: auto; }
.proposal .thumbs img { width: 56px; height: 44px; object-fit: cover; border-radius: 3px; flex: none; border: 1px solid var(--line); }

/* visualizador de fotos */
.lb {
  position: fixed; inset: 0; z-index: 70; background: var(--scrim); color: var(--scrim-ink);
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.lb .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0; }
.lb .mono { color: var(--scrim-ink); opacity: 0.8; }
.lb .btn { border-color: var(--scrim-ink); color: var(--scrim-ink); }
.lb .btn:hover { background: rgb(255 255 255 / 0.12); }
.lb .btn.danger { border-color: #FF7456; color: #FF7456; }
.lb .btn[aria-pressed="true"] { background: var(--scrim-ink); color: #0b0f0e; }
.stage { position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.stage img { max-width: 100%; max-height: 100%; object-fit: contain; }
.nav { position: absolute; top: 50%; transform: translateY(-50%); min-width: 44px; padding-inline: 0; background: rgb(8 12 11 / 0.55); }
.nav.prev { left: 0; } .nav.next { right: 0; }
.lb .foot { display: grid; gap: 10px; max-width: 760px; width: 100%; margin: 0 auto; }
.lb .input { background: transparent; border-color: rgb(255 255 255 / 0.35); color: var(--scrim-ink); }
.lb .cap { margin: 0; min-height: 24px; text-align: center; overflow-wrap: anywhere; }
.lb .meta { text-align: center; margin: 0; }

/* modo discreto */
body.discreet .cover img, body.discreet .hero img, body.discreet .photo img, body.discreet .stage img, body.discreet .memory img, body.discreet .proposal img { filter: blur(16px); }
body.discreet .note, body.discreet .txt, body.discreet .day textarea, body.discreet figcaption { filter: blur(6px); }

/* livro: visualizador e editor */
.bk { position: fixed; inset: 0; z-index: 70; background: #121211; color: #EDEAE3; display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; font-family: var(--body);
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.bk .bar { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid #2a2a28; }
.bk .bar h3 { margin: 0; font: 400 1.35rem/1 var(--display); letter-spacing: -0.01em; margin-right: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bk .seg { display: inline-flex; border: 1px solid #3a3a37; border-radius: 999px; padding: 2px; gap: 2px; }
.bk .seg button { border: 0; background: transparent; color: #bdb9b0; padding: 5px 11px; border-radius: 999px; cursor: pointer; font-size: 0.82rem; min-height: 30px; }
.bk .seg button[aria-pressed="true"] { background: #EDEAE3; color: #121211; }
.bk .seg button:hover:not([aria-pressed="true"]) { background: #2a2a28; }
.bk .btn { border-color: #4a4a46; color: #EDEAE3; background: transparent; }
.bk .btn:hover:not(:disabled) { background: #2a2a28; }
.bk .btn.pri { background: #EDEAE3; color: #121211; border-color: #EDEAE3; }
.bk .btn[aria-pressed="true"] { background: #E6B04B; color: #1b1405; border-color: #E6B04B; }
.bk .stagewrap { position: relative; min-height: 0; display: grid; place-items: center; overflow: hidden; padding: 14px 56px; }
.bk .spread { display: flex; box-shadow: 0 30px 80px rgb(0 0 0 / 0.55), 0 4px 14px rgb(0 0 0 / 0.4); transition: opacity 0.22s ease, transform 0.22s ease; }
.bk .spread.out { opacity: 0; transform: translateY(6px) scale(0.995); }
.bk .spread .pg { flex: none; }
.bk .spread .pg.sl::after, .bk .spread .pg.sr::after { content: ""; position: absolute; top: 0; bottom: 0; width: 6cqw; pointer-events: none; z-index: 5; }
.bk .spread .pg.sl::after { right: 0; background: linear-gradient(90deg, transparent, rgb(0 0 0 / 0.16)); }
.bk .spread .pg.sr::after { left: 0; background: linear-gradient(270deg, transparent, rgb(0 0 0 / 0.16)); }
.bk .spread .pg.cover { box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.04); }
.bk .nv { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 64px; border: 0; background: transparent; color: #EDEAE3; font-size: 1.8rem; cursor: pointer; border-radius: 10px; }
.bk .nv:hover:not(:disabled) { background: #26261f; }
.bk .nv:disabled { opacity: 0.2; cursor: default; }
.bk .nv.l { left: 4px; } .bk .nv.r { right: 4px; }
.bk .strip { display: flex; gap: 10px; overflow-x: auto; padding: 10px 16px 12px; border-top: 1px solid #2a2a28; scrollbar-width: thin; }
.bk .strip button { flex: none; border: 2px solid transparent; background: none; padding: 0; border-radius: 4px; cursor: pointer; display: flex; opacity: 0.62; }
.bk .strip button[aria-current="true"] { border-color: #E6B04B; opacity: 1; }
.bk .strip button:hover { opacity: 1; }
.bk .strip .pg { width: 62px; pointer-events: none; }
.bk .strip .pg .tx, .bk .strip .pg .hd, .bk .strip .pg .folio { display: none; }
.bk .tools { display: flex; gap: 8px 10px; flex-wrap: wrap; align-items: center; padding: 10px 16px; border-top: 1px solid #2a2a28; background: #181816; min-height: 54px; }
.bk .tools .sp { flex: 1; }
.bk .tools small { color: #9a968d; font-size: 0.8rem; }
.bk .tray { display: flex; gap: 6px; overflow-x: auto; max-width: 100%; padding: 2px 0; }
.bk .tray button { flex: none; width: 44px; height: 44px; border-radius: 4px; border: 1px solid #4a4a46; padding: 0; background: #222 center / cover no-repeat; cursor: pointer; }
.bk .tray button:hover { border-color: #E6B04B; }
.bk.editing .spread .pg { cursor: pointer; }
.bk.editing .spread .pg.act { outline: 2px solid #E6B04B; outline-offset: 3px; }
.bk.editing .spread .pg .ph { cursor: grab; }
.bk [contenteditable="true"] { outline: 1px dashed #E6B04B; outline-offset: 2px; cursor: text; }
.bk .pickrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.pg { box-sizing: border-box; container-type: inline-size; position: relative; width: 100%; background: var(--paper); color: var(--ink); overflow: hidden; font-family: var(--fb); font-size: 1.6cqw; line-height: 1.5; text-align: left; -webkit-font-smoothing: antialiased; }
.pg *, .pg *::before, .pg *::after { box-sizing: border-box; }
.pg .ph { position: absolute; overflow: hidden; background: color-mix(in srgb, var(--mute) 18%, var(--paper)); border-radius: var(--round); }
.pg .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.pg .mn { font-family: var(--fm); font-size: 1.05cqw; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mute); line-height: 1.4; }
.pg .mn.up { color: var(--accent); }
.pg .in { position: absolute; display: flex; flex-direction: column; }
.pg .in.c { align-items: center; justify-content: center; text-align: center; gap: 3cqw; }
.pg h1, .pg h2 { font-family: var(--fd); font-weight: 400; margin: 0; letter-spacing: -0.012em; line-height: 1.02; text-wrap: balance; overflow-wrap: anywhere; }
.pg .tx { white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--ft); hyphens: auto; }
.pg .tx.body { line-height: 1.58; color: var(--ink); }
.pg .tx.lead { font-family: var(--fd); line-height: 1.28; color: var(--ink); margin-top: 3cqw; max-width: 82%; font-size: 2.6cqw; }
.pg .tx.c { text-align: center; }
.pg .folio { position: absolute; bottom: 1.5cqw; font-family: var(--fm); font-size: 0.95cqw; letter-spacing: 0.1em; color: var(--mute); z-index: 3; }
.pg .folio.fl { left: var(--m); } .pg .folio.fr { right: var(--m); }
.pg .hd { position: absolute; left: var(--m); top: calc(var(--m) * 0.5 + 0.2cqw); display: flex; gap: 1.2cqw; align-items: baseline; font-family: var(--fm); font-size: 0.98cqw; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mute); z-index: 3; }
.pg.sr .hd { left: auto; right: var(--m); }
.pg .hd b { color: var(--accent); font-weight: 400; }
.pg .cap { position: absolute; z-index: 3; font-family: var(--fd); font-style: italic; font-size: 1.7cqw; line-height: 1.3; max-width: 60%; }
.pg .cap.bleed { left: 4cqw; bottom: 3.2cqw; color: #fff; text-shadow: 0 1px 14px rgb(0 0 0 / 0.5); }
.pg .cap.fit { left: var(--m); bottom: 1.4cqw; color: var(--mute); }
.pg .cap2 { position: absolute; font-family: var(--fd); font-style: italic; font-size: 1.15cqw; color: var(--mute); line-height: 1.25; }
.pg .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgb(0 0 0 / 0.04) 40%, rgb(0 0 0 / 0.66)); z-index: 1; pointer-events: none; }
.pg .shade.low { background: linear-gradient(180deg, transparent 72%, rgb(0 0 0 / 0.5)); }
.pg .orn { font-family: var(--fd); font-size: 3cqw; color: var(--rule); position: absolute; inset: 0; display: grid; place-items: center; }
.pg .in.c .orn { position: static; font-size: 2.4cqw; }

/* capa */
.pg.cover .ct { position: absolute; z-index: 2; display: flex; flex-direction: column; gap: 1.6cqw; }
.pg.cover h1 { color: inherit; max-width: 100%; }
.pg.cover.bleed, .pg.cover.center { color: #fff; }
.pg.cover.bleed .ct { left: 5cqw; right: 5cqw; bottom: 5.2cqw; }
.pg.cover.bleed .mn, .pg.cover.center .mn { color: rgb(255 255 255 / 0.88); }
.pg.cover.bleed h1 { max-width: 88%; }
.pg.cover.center .ct { left: 5cqw; right: 5cqw; bottom: 8cqw; align-items: center; text-align: center; }
.pg.cover.center .ct .mn { order: 2; }
.pg.cover.center h1 { color: var(--accent); }
.pg.cover.frame .ct, .pg.cover.split .ct { position: absolute; gap: 1cqw; }
.pg.cover.frame .ct { text-align: center; align-items: center; }
.pg.cover.frame .ct h1 { font-style: italic; }
.pg.cover.split .ct h1 { font-weight: 700; letter-spacing: -0.03em; }
.pg.cover.nopic .ct { position: absolute; left: 6cqw; right: 6cqw; bottom: 8cqw; }
.pg.cover.nopic h1 { color: var(--accent); }

/* introdução */
.pg .top { display: flex; justify-content: space-between; gap: 2cqw; }
.pg.intro .in { justify-content: space-between; }
.pg h2.big { font-size: 7.6cqw; margin-top: 4cqw; max-width: 90%; }
.pg.intro .in h2.big { margin-top: auto; }
.pg .stats, .pg .nums { display: flex; gap: 5cqw; flex-wrap: wrap; border-top: 1px solid var(--rule); padding-top: 2.2cqw; margin-top: 3cqw; }
.pg .stats b, .pg .nums b { display: block; font-family: var(--fd); font-weight: 400; font-size: 4cqw; line-height: 1; letter-spacing: -0.01em; }
.pg .stats span, .pg .nums span { font-family: var(--fm); font-size: 0.95cqw; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mute); }
.pg .nums { border-top: 0; justify-content: center; }

/* mapa */
.pg .mapfull { position: absolute; overflow: hidden; border-radius: var(--round); background: var(--rule); }
.pg .mapfull svg, .pg .mapfull img.mapimg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.pg .maplab b { font-family: var(--fd); font-weight: 400; font-size: 2.8cqw; line-height: 1.05; }
.pg.sr .maplab { left: auto; right: 0; padding: 1.8cqw 0 0 2.4cqw; }

/* abertura de dia */
.pg .num { font-family: var(--fd); font-size: 17cqw; line-height: 0.78; letter-spacing: -0.04em; color: var(--accent); margin-bottom: 3cqw; }

.pg.textpage .in { justify-content: flex-start; }

/* fecho */
.pg.back { background: var(--ink); color: var(--paper); }
.pg.back.t-noite { background: var(--paper); color: var(--accent); }
.pg .bk-t { position: absolute; left: 0; right: 0; bottom: 8cqw; text-align: center; display: flex; flex-direction: column; gap: 1cqw; align-items: center; }

.pg.end h2.big.sm { font-size: 5.4cqw; margin: 0; max-width: 80%; }

/*BOOK-END*/

const DEG = Math.PI / 180;
const MAP_W = 1000, LAT_TOP = 84, LAT_BOT = -58;

/* Projeção Natural Earth 1 */
function neX(lat, lon) {
  const p = lat * DEG, p2 = p * p, p4 = p2 * p2;
  return lon * DEG * (0.8707 - 0.131979 * p2 + p4 * (-0.013791 + p4 * (0.003971 * p2 - 0.001529 * p4)));
}
function neY(lat) {
  const p = lat * DEG, p2 = p * p, p4 = p2 * p2;
  return p * (1.007226 + p2 * (0.015085 + p4 * (-0.044475 + 0.028874 * p2 - 0.005916 * p4)));
}
const MAP_K = MAP_W / (2 * neX(0, 180));
const MAP_YTOP = MAP_K * neY(LAT_TOP);
const MAP_H = MAP_K * (neY(LAT_TOP) - neY(LAT_BOT));
function project(lon, lat) {
  return [MAP_W / 2 + MAP_K * neX(lat, lon), MAP_YTOP - MAP_K * neY(lat)];
}
function unproject(px, py) {

  let p = y;

    const p2 = p * p, p6 = p2 * p2 * p2, p8 = p6 * p2, p10 = p8 * p2, p11 = p10 * p;
    const f = 1.007226 * p + 0.015085 * p2 * p - 0.044475 * p6 * p + 0.028874 * p8 * p - 0.005916 * p11 - y;
    const d = 1.007226 + 0.045255 * p2 - 0.311325 * p6 + 0.259866 * p8 - 0.065076 * p10;
    const step = f / d; p -= step;
    if (Math.abs(step) < 1e-12) break;
  }
  const p2 = p * p, p4 = p2 * p2;
  const fx = 0.8707 - 0.131979 * p2 + p4 * (-0.013791 + p4 * (0.003971 * p2 - 0.001529 * p4));
  const lat = Math.max(-90, Math.min(90, p / DEG));

/* ---------- datas em português ---------- */
const BK_WD = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
const BK_MO = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
function bkDayLong(ymd) { const d = parseYmd(ymd); return d ? `${BK_WD[d.getUTCDay()]}, ${d.getUTCDate()} de ${BK_MO[d.getUTCMonth()]}` : ''; }
function bkDayShort(ymd) { const d = parseYmd(ymd); return d ? `${d.getUTCDate()} ${BK_MO[d.getUTCMonth()].slice(0, 3)}` : ''; }
function bkRange(t) {

  const f = d => `${d.getUTCDate()} ${BK_MO[d.getUTCMonth()]} ${d.getUTCFullYear()}`;

const bkNum = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

/* ---------- colagens sem cortes: todas as árvores de cortes em ordem ---------- */
const _treeMemo = new Map();
function bkTrees(n) {
  if (_treeMemo.has(n)) return _treeMemo.get(n);
  const memo = new Map();
  const rec = (i, j) => {
    const key = i * 16 + j;
    if (memo.has(key)) return memo.get(key);
    let out;
    if (i === j) out = [{ leaf: i }];
    else {
      out = [];
      for (let k = i; k < j; k++) for (const a of rec(i, k)) for (const b of rec(k + 1, j)) { out.push({ dir: 'H', a, b }); out.push({ dir: 'V', a, b }); }
    }
    memo.set(key, out); return out;
  };
  const all = rec(0, n - 1);
  _treeMemo.set(n, all);
  return all;
}
function bkNat(node, ars) {
  if (node.leaf != null) return ars[node.leaf];
  const a = bkNat(node.a, ars), b = bkNat(node.b, ars);
  return node.dir === 'H' ? a + b : 1 / (1 / a + 1 / b);
}
function bkPlace(node, ars, x, y, w, h, gap, out) {
  if (node.leaf != null) { out.push({ i: node.leaf, x, y, w, h }); return; }
  const a = bkNat(node.a, ars), b = bkNat(node.b, ars);
  if (node.dir === 'H') {
    const wa = (w - gap) * a / (a + b);
    bkPlace(node.a, ars, x, y, wa, h, gap, out);
    bkPlace(node.b, ars, x + wa + gap, y, w - gap - wa, h, gap, out);
  } else {
    const ia = 1 / a, ib = 1 / b, ha = (h - gap) * ia / (ia + ib);
    bkPlace(node.a, ars, x, y, w, ha, gap, out);
    bkPlace(node.b, ars, x, y + ha + gap, w, h - gap - ha, gap, out);
  }
}
/* devolve as melhores disposições diferentes entre si: [{rects:[{i,x,y,w,h}], score}] */
function bkCollages(ars, wts, box, gap, keep) {
  const n = ars.length;
  if (n === 1) return [{ rects: [{ i: 0, x: box.x, y: box.y, w: box.w, h: box.h }], score: 0 }];
  const hero = wts && wts.some(v => v !== wts[0]);
  const sum = hero ? wts.reduce((s, v) => s + v, 0) : 0;
  const scored = [];
  for (const tr of bkTrees(n)) {
    const rects = [];
    bkPlace(tr, ars, box.x, box.y, box.w, box.h, gap, rects);
    let area = 0; for (const r of rects) area += r.w * r.h;
    let s = 0;
    for (const r of rects) {
      const c = Math.log((r.w / r.h) / ars[r.i]);
      s += c * c;
      const fr = r.w * r.h / area;
      if (fr < 0.07) s += (0.07 - fr) * 30;
      const cell = r.w / r.h;
      if (cell > 3.3 || cell < 0.3) s += 1.5;
      if (hero) s += 6 * Math.pow(fr - wts[r.i] / sum, 2);
    }
    scored.push({ rects, score: s });
  }
  scored.sort((p, q) => p.score - q.score);
  const out = [], seen = [];
  const sig = rs => rs.slice().sort((p, q) => p.i - q.i).map(r => [r.x, r.y, r.w, r.h]);
  for (const c of scored) {
    const sg = sig(c.rects);
    const same = seen.some(o => o.every((q, k) => Math.abs(q[0] - sg[k][0]) < box.w * 0.06 && Math.abs(q[1] - sg[k][1]) < box.h * 0.06 && Math.abs(q[2] - sg[k][2]) < box.w * 0.06 && Math.abs(q[3] - sg[k][3]) < box.h * 0.06));
    if (same) continue;
    seen.push(sg); out.push(c);
    if (out.length >= (keep || 6)) break;
  }
  return out;
}

/* caixa útil da página, em unidades (largura 100) */
function bkBox(theme, side, H, head) {
  const m = theme.margin, sp = m * 0.5;
  const left = m + (side === 'R' ? sp : 0), right = m + (side === 'L' ? sp : 0);
  const top = m + (head ? 4.2 : 0), bottom = m + (m > 0 ? 3.4 : 0);
  return { x: left, y: top, w: 100 - left - right, h: H - top - bottom };
}

/* ---------- construção automática ---------- */
function bkPhotoSort(t) {
  const arr = (t.photos || []).map((p, i) => ({ p, i }));
  arr.sort((a, b) => ((a.p.date || '9999') + ' ' + (a.p.time || '')).localeCompare((b.p.date || '9999') + ' ' + (b.p.time || '')) || a.i - b.i);
  return arr.map(x => x.p);
}
const bkAr = p => (p && p.w > 0 && p.h > 0) ? p.w / p.h : 1.5;

function bkSplitText(text, first, rest) {
  const t = String(text || '').trim();
  if (!t) return [];
  const out = []; let cur = t, lim = first;
  while (cur.length > lim) {
    let cut = cur.lastIndexOf('\n\n', lim);
    if (cut < lim * 0.4) cut = cur.lastIndexOf('\n', lim);
    if (cut < lim * 0.4) { const m = [...cur.slice(0, lim).matchAll(/[.!?…]\s/g)]; cut = m.length ? m[m.length - 1].index + 1 : -1; }
    if (cut < lim * 0.4) cut = cur.lastIndexOf(' ', lim);
    if (cut <= 0) cut = lim;
    out.push(cur.slice(0, cut).trim()); cur = cur.slice(cut).trim(); lim = rest;
  }
  if (cur) out.push(cur);
  return out;
}
function bkPaginate(list) {
  const out = []; let cur = [], pi = 0;
  const pattern = [4, 3, 5, 3, 4, 2, 4];
  const flush = () => { if (cur.length) { out.push({ ids: cur.map(p => p.id), full: false }); cur = []; } };
  for (const p of list) {
    if (p.fav || bkAr(p) > 2.3) { flush(); out.push({ ids: [p.id], full: true }); continue; }
    cur.push(p);
    if (cur.length >= pattern[pi % pattern.length]) { flush(); pi++; }
  }
  flush();
  for (let i = out.length - 1; i > 0; i--) {
    if (out[i].ids.length === 1 && !out[i].full && out[i - 1].ids.length < 5 && !out[i - 1].full) { out[i - 1].ids.push(out[i].ids[0]); out.splice(i, 1); }
  }
  return out;
}
function bkDistance(t) {
  const tr = t.track || [];
  let km = 0;
  for (let i = 3; i + 2 < tr.length; i += 3) km += haversineKm(tr[i - 3], tr[i - 2], tr[i], tr[i + 1]);
  return km;
}

function bookAuto(t, opts) {
  opts = opts || {};
  const photos = bkPhotoSort(t);
  const byId = new Map(photos.map(p => [p.id, p]));
  const days = tripDays(t);
  const cover = (t.cover && byId.has(t.cover)) ? t.cover : (photos.find(p => p.fav) || photos.find(p => bkAr(p) > 1.2) || photos[0] || {}).id || null;
  const pages = [{ t: 'cover', id: cover }];
  pages.push({ t: 'intro' });
  if (tripPoint(t)) pages.push({ t: 'map' });
  const groups = [];
  const dayHas = new Set();
  for (const d of days) {
    const ps = photos.filter(p => p.date === d);
    const text = ((t.days || {})[d] || '').trim();
    if (ps.length || text) groups.push({ date: d, ps, text });
    ps.forEach(p => dayHas.add(p.id));
  }
  const loose = photos.filter(p => !dayHas.has(p.id));
  if (loose.length) groups.push({ date: '', ps: loose, text: '' });
  for (const g of groups) {
    let pool = g.ps.slice();
    const chunks = bkSplitText(g.text, 760, 1250);
    const useOpener = !!g.date && (chunks.length > 0 || pool.length >= 8);
    let openerPhoto = null;
    if (useOpener && pool.length >= 2) {
      openerPhoto = pool.find(p => p.fav) || pool.find(p => bkAr(p) < 1) || pool[0];
      pool = pool.filter(p => p !== openerPhoto);
    }
    if (useOpener) {
      pages.push({ t: 'day', date: g.date, text: chunks[0] || '', ids: openerPhoto ? [openerPhoto.id] : [] });
      for (let k = 1; k < chunks.length; k++) pages.push({ t: 'text', date: g.date, text: chunks[k], cont: true });
    }
    const pieces = bkPaginate(pool);
    pieces.forEach((pc, idx) => {
      const pg = { t: pc.full ? 'full' : 'collage', ids: pc.ids };
      if (!useOpener && idx === 0) { pg.date = g.date; if (g.text) pg.note = g.text.length < 200 ? g.text : ''; }
      if (!g.date && idx === 0) pg.more = true;
      pages.push(pg);
    });
  }
  const inner = pages.length - 1;
  if (inner % 2 === 1) pages.push({ t: 'rest' });
  pages.push({ t: 'end' }, { t: 'colophon' });
  pages.push({ t: 'back' });
  return { v: 1, theme: opts.theme || 'revista', fmt: opts.fmt || 'land', pages, auto: true };
}

/* inclui fotos novas (não usadas) no fim, antes do fecho */
function bookUnused(t, book) {
  const used = new Set();
  for (const p of book.pages) { if (p.id) used.add(p.id); (p.ids || []).forEach(i => used.add(i)); }
  return bkPhotoSort(t).filter(p => !used.has(p.id));
}

function bookPageSide(book, i) {
  if (i <= 0 || i >= book.pages.length - 1) return 'C';
  return i % 2 === 1 ? 'L' : 'R';
}

  const n = book.pages.length, out = [[0]];
  for (let i = 1; i < n - 1; i += 2) out.push(i + 1 < n - 1 ? [i, i + 1] : [i]);
  out.push([n - 1]);
  return out;
}

/* ---------- HTML das páginas ---------- */
const bkPct = (v, tot) => (Math.round(v / tot * 10000) / 100) + '%';
function bkThemeVars(th) {

function bkCell(ctx, id, r, W, H, page, extra) {

function bkTextSize(len, big) {

  return len <= 220 ? 2.35 : len <= 420 ? 2.05 : len <= 700 ? 1.8 : 1.55;
}
const bkTx = (field, text, size, cls) => `<div class="tx ${cls || ''}" data-field="${field}" style="font-size:${size}cqw">${esc(text)}</div>`;

function bookPageHTML(page, book, idx, ctx) {
  const th = bookTheme(book), fmt = bookFmt(book), W = 100, H = 100 / fmt.ar;
  const side = bookPageSide(book, idx), t = ctx.trip;
  const sideCls = side === 'L' ? 'sl' : side === 'R' ? 'sr' : '';
  const open = (cls, inner, style) => `<div class="pg ${cls} ${sideCls} t-${book.theme || 'revista'}" data-page="${idx}" style="${bkThemeVars(th)};aspect-ratio:${fmt.ar}${style ? ';' + style : ''}">${inner}</div>`;
  const folio = (!th.dark || true) && side !== 'C' ? `<div class="folio ${side === 'L' ? 'fl' : 'fr'}">${idx}</div>` : '';
  const head = pg => pg.date ? `<div class="hd"><b>${pg.n ? 'Dia ' + pg.n : ''}</b><span>${esc(bkDayLong(pg.date))}</span></div>` : (pg.more ? '<div class="hd"><span>Mais momentos</span></div>' : '');

      const dates = bkRange(t), place = [t.place, t.country].filter(Boolean).join(', ');
      const sub = esc([place, dates].filter(Boolean).join('  ·  '));

      if (!id) return open('cover nopic', `<div class="ct"><span class="mn">${sub}</span><h1 style="font-size:${tsz}cqw" data-field="title">${title}</h1></div>`);
      const style = th.cover;
      if (style === 'frame') {
        const m = th.margin, bx = { x: m, y: m, w: 100 - 2 * m, h: H * 0.72 - m };
        return open('cover frame', bkCell(ctx, id, bx, W, H, page, 'solo') + `<div class="ct" style="left:${bkPct(m, W)};right:${bkPct(m, W)};top:${bkPct(bx.y + bx.h + 3.2, H)}"><h1 style="font-size:${tsz * 0.62}cqw" data-field="title">${title}</h1><span class="mn">${sub}</span></div>`);
      }
      if (style === 'split') {
        const m = th.margin, bx = { x: m, y: m, w: 100 - 2 * m, h: H * 0.68 };
        return open('cover split', bkCell(ctx, id, bx, W, H, page, 'solo') + `<div class="ct" style="left:${bkPct(m, W)};right:${bkPct(m, W)};top:${bkPct(m + bx.h + 3, H)}"><h1 style="font-size:${tsz * 0.62}cqw" data-field="title">${title}</h1><span class="mn">${sub}</span></div>`);
      }

const GRAT_D = (() => {
  let d = '';
  for (let lo = -180; lo <= 180; lo += 30) { const a = project(lo, LAT_TOP), b = project(lo, LAT_BOT); d += `M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${b[0].toFixed(1)} ${b[1].toFixed(1)}`; }
  for (let la = -30; la <= 60; la += 30) { const a = project(-180, la), b = project(180, la); d += `M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${b[0].toFixed(1)} ${b[1].toFixed(1)}`; }
  return d;

const LAND_D = LAND.map(polyPath).join('');
const SEA_D = SEAS.map(polyPath).join('');
const BOOK_PAL = { sea: '#E1E9E7', land: '#FFFFFF', coast: '#A5B5B1', grat: '#CFDAD7', pin: '#C8341B', dot: '#1F3F9E', route: '#1F3F9E' };

function fitView(points, minW, aspect) {
  if (!points.length) return { x: 0, y: 0, w: MAP_W };
  const ar = aspect || MAP_W / MAP_H;
  const xs = points.map(p => project(p.lng, p.lat)[0]), ys = points.map(p => project(p.lng, p.lat)[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const w = Math.min(MAP_W, Math.max(minW || 220, (x1 - x0) * 1.5, (y1 - y0) * 1.5 * ar));
  const hh = w / ar;
  return { x: Math.max(0, Math.min(MAP_W - w, (x0 + x1) / 2 - w / 2)), y: Math.max(0, Math.min(MAP_H - hh, (y0 + y1) / 2 - hh / 2)), w };
}

function createMap(o) {
  const pal = o.palette || null;
  const col = (k, v) => pal ? pal[k] : `var(--${v})`;
  const svg = svgEl('svg', { viewBox: `0 0 ${MAP_W} ${MAP_H}`, role: 'img', 'aria-label': o.label || 'Mapa-múndi', xmlns: SVGNS });
  svg.append(
    svgEl('rect', o.aspect ? { x: -4000, y: -4000, width: 9000, height: 9000, fill: col('sea', 'sea') } : { x: 0, y: 0, width: MAP_W, height: MAP_H, fill: col('sea', 'sea') }),
    svgEl('path', { d: GRAT_D, fill: 'none', stroke: col('grat', 'grat'), 'stroke-width': 1, 'vector-effect': 'non-scaling-stroke' }),
    svgEl('path', { d: LAND_D, fill: col('land', 'land'), stroke: col('coast', 'coast'), 'stroke-width': 1, 'stroke-linejoin': 'round', 'vector-effect': 'non-scaling-stroke' }),
    svgEl('path', { d: SEA_D, fill: col('sea', 'sea'), stroke: col('coast', 'coast'), 'stroke-width': 1, 'vector-effect': 'non-scaling-stroke' }));
  const gRoute = svgEl('g'), gDots = svgEl('g'), gPins = svgEl('g'), gPick = svgEl('g');
  svg.append(gRoute, gDots, gPins, gPick);

  const pins = o.pins || [];
  if (o.route && pins.length > 1) {
    const d = pins.map((p, i) => { const q = project(p.lng, p.lat); return (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1); }).join('');
    gRoute.append(svgEl('path', { d, fill: 'none', stroke: col('route', 'blue'), 'stroke-width': 1.6, 'stroke-dasharray': '6 5', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: 0.85, 'vector-effect': 'non-scaling-stroke' }));
  }
  const scaled = [];
  if (o.track && o.track.length >= 6) {
    let d = '';
    for (let i = 0; i + 2 < o.track.length; i += 3) { const q = project(o.track[i + 1], o.track[i]); d += (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1); }
    gRoute.append(svgEl('path', { d, fill: 'none', stroke: col('route', 'blue'), 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: 0.9, 'vector-effect': 'non-scaling-stroke' }));
  }
  for (const d of (o.dots || [])) {
    const q = project(d.lng, d.lat);
    const g = svgEl('g', { transform: `translate(${q[0].toFixed(1)} ${q[1].toFixed(1)})` });
    g.append(svgEl('circle', { r: 3.5, fill: col('dot', 'blue'), stroke: pal ? '#fff' : 'var(--surface)', 'stroke-width': 1 }));
    gDots.append(g); scaled.push([g, q]);
  }
  for (const p of pins) {
    const q = project(p.lng, p.lat);
    const g = svgEl('g', { class: 'pin', transform: `translate(${q[0].toFixed(1)} ${q[1].toFixed(1)})`, 'data-id': p.id });
    if (!o.static) { g.setAttribute('tabindex', '0'); g.setAttribute('role', 'button'); g.setAttribute('aria-label', p.label || 'Viagem'); }
    if (p.label && !o.static) g.append(svgEl('title', {}, document.createTextNode(p.label)));
    g.append(svgEl('circle', { class: 'ring', r: p.sel ? 13 : 10, fill: 'none', stroke: p.sel ? col('route', 'blue') : 'none', 'stroke-width': 2.5 }));
    g.append(svgEl('circle', { r: 7, fill: col('pin', 'accent'), stroke: pal ? '#fff' : 'var(--surface)', 'stroke-width': 2.5 }));
    if (!o.static) {
      g.addEventListener('pointerdown', e => e.stopPropagation());
      g.addEventListener('click', e => { e.stopPropagation(); o.onPin && o.onPin(p.id); });
      g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); o.onPin && o.onPin(p.id); } });
    }
    gPins.append(g); scaled.push([g, q]);
  }

  let { x: vx, y: vy, w: vw } = o.view || { x: 0, y: 0, w: MAP_W };
  const box = h('div', { class: 'mapbox' + (o.onPick ? ' pick' : '') });
  const vh = () => vw / (o.aspect || MAP_W / MAP_H);
  const clampView = () => { vw = Math.max(20, Math.min(MAP_W, vw)); vx = Math.max(0, Math.min(MAP_W - vw, vx)); vy = Math.max(0, Math.min(MAP_H - vh(), vy)); };

      h('button', { type: 'button', 'aria-label': 'Afastar', onclick: () => zoom(1.67) }, '−'),
      h('button', { type: 'button', 'aria-label': 'Ver o mundo todo', onclick: () => { vx = 0; vy = 0; vw = MAP_W; apply(); } }, '⟲')));
    let drag = null;
    svg.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse' && e.button !== 0) return; drag = { id: e.pointerId, x: e.clientX, y: e.clientY, vx, vy, moved: false }; });
    svg.addEventListener('pointermove', e => {

/* "Neste dia" */

  for (const p of photos) if (!p.date || !days.includes(p.date)) out.push(p);
  return out;
}

function wireDrop(el, tripId) {
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('over'); });

  el.addEventListener('drop', e => {
    e.preventDefault(); el.classList.remove('over');

    if (files.length) addPhotos(tripId, files);
  });
}

const SAFE = /^[A-Za-z0-9-]+$/;
function go(id) {
  if (id && SAFE.test(id)) location.hash = 'viagem-' + id;
  else if (id) { view = { name: 'trip', id }; render(); window.scrollTo(0, 0); }
  else location.hash = ui.tab;
}
function applyHash() {
  const hs = location.hash.slice(1);
  const m = hs.match(/^viagem-([A-Za-z0-9-]+)$/);
  let nv = view;
  if (m) nv = { name: 'trip', id: m[1] };
  else { if (TABS.some(([k]) => k === hs)) ui.tab = hs; nv = { name: 'home', id: null }; }
  const changed = nv.name !== view.name || nv.id !== view.id;
  view = nv;
  if (changed) { closeLightbox(); closeModal(); closeBook(); window.scrollTo(0, 0); }
  render();
}
window.addEventListener('hashchange', applyHash);

/* ---------- gravação ---------- */
function saveTrip(tripId, build) {
  return enqueue(tripId, async () => {
    const t = tripById(tripId);
    if (!t) return false;
    const patch = build(t);
    if (!patch) return false;
    try { await db.doc('trips/' + tripId).update(patch); return true; }
    catch (e) { setStatus('Não foi possível guardar. Tenta outra vez.', 4000); return false; }
  });
}

/* ---------- percurso GPS (Google Maps Timeline, GPX, KML, GeoJSON) ---------- */

    if (first) { const ys = trips.map(t => +(t.start || '').slice(0, 4)).filter(Boolean); if (ys.length) ui.year = Math.max(...ys); }
    if (!same || first) { render(); if (lb) drawLightbox(); if (bk && !(document.activeElement && document.activeElement.isContentEditable)) drawBook(0); }
  }, () => { clearTimeout(slowTimer); loadError = true; loaded = true; render(); });
}
init();
