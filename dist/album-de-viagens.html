<title>Álbum de Viagens</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: capa de correio aéreo no topo, separadores (mapa, viagens, ano, fotos), página de viagem com diário por dia. */
:root {
  --bg: #F1F2EE;
  --surface: #FFFFFF;
  --ink: #14201D;
  --ink-2: #55635F;
  --line: #D5DAD5;
  --hover: #E6E9E4;
  --accent: #C8341B;
  --on-accent: #FFFFFF;
  --blue: #1F3F9E;
  --stripe-a: #C8341B;
  --stripe-b: #1F3F9E;
  --sea: #E1E9E7;
  --land: #FFFFFF;
  --coast: #A5B5B1;
  --grat: #CFDAD7;
  --scrim: rgb(8 12 11 / 0.94);
  --scrim-ink: #EEF2F0;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "DM Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1614; --surface: #18221F; --ink: #E9EEEB; --ink-2: #9BAAA5; --line: #2A3834;
    --hover: #223029; --accent: #FF7456; --on-accent: #1B0A05; --blue: #8EA8FF;
    --stripe-a: #E2543A; --stripe-b: #4A6BE0;
    --sea: #131E1C; --land: #22322E; --coast: #3B4F4A; --grat: #1C2A27; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1614; --surface: #18221F; --ink: #E9EEEB; --ink-2: #9BAAA5; --line: #2A3834;
  --hover: #223029; --accent: #FF7456; --on-accent: #1B0A05; --blue: #8EA8FF;
  --stripe-a: #E2543A; --stripe-b: #4A6BE0;
  --sea: #131E1C; --land: #22322E; --coast: #3B4F4A; --grat: #1C2A27; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--body); margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
img { display: block; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.airmail {
  height: 10px;
  background: repeating-linear-gradient(-45deg,
    var(--stripe-a) 0 14px, var(--bg) 14px 22px, var(--stripe-b) 22px 36px, var(--bg) 36px 44px);
}
.wrap {
  max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 96px;
}

.mono { font-family: var(--mono); font-size: 0.8rem; letter-spacing: 0.02em; color: var(--ink-2); }
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 24px; margin-bottom: 22px; }
.top > div { min-width: 0; }
h1 { font: 700 clamp(2.2rem, 7vw, 3.9rem)/1 var(--display); letter-spacing: -0.025em; margin: 0 0 12px; text-wrap: balance; }
h2.year { font: 500 0.9rem var(--mono); letter-spacing: 0.08em; color: var(--ink-2); margin: 0 0 16px; display: flex; align-items: center; gap: 14px; }
h2.year::after { content: ""; flex: 1; height: 1px; background: var(--line); }
h2.sec { font: 600 1.3rem/1.2 var(--display); margin: 0 0 14px; letter-spacing: -0.01em; }
h3 { font: 600 1.2rem/1.2 var(--display); margin: 0; letter-spacing: -0.01em; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0.55rem 1.1rem; border-radius: 4px; cursor: pointer;
  border: 1px solid var(--ink); background: transparent; font-weight: 600; font-size: 0.95rem;
}
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.quiet { border-color: var(--line); }
.btn.danger { border-color: var(--accent); color: var(--accent); }
.btn.sm { min-height: 36px; padding: 0.3rem 0.8rem; font-size: 0.85rem; }
.btn[disabled] { opacity: 0.5; cursor: default; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* separadores */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 26px; overflow-x: auto; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px 9px; cursor: pointer; font: 600 0.95rem var(--body); color: var(--ink-2); min-height: 44px; white-space: nowrap; margin-bottom: -1px; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

/* barra de filtros */
.bar { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; margin-bottom: 22px; }
.search { flex: 1 1 220px; min-width: 0; }
.input { width: 100%; min-height: 44px; padding: 0.55rem 0.7rem; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--ink); }
.surface .input { background: var(--bg); }
textarea.input { min-height: 96px; resize: vertical; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 12px; font: 500 0.82rem var(--mono); cursor: pointer; min-height: 32px; color: var(--ink-2); }
.chip:hover { background: var(--hover); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.static { cursor: default; }
.chip.static:hover { background: transparent; }

/* viagens */
.years { display: flex; flex-direction: column; gap: 44px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 30px 22px; }
.card { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.cover { position: relative; aspect-ratio: 4 / 3; width: 100%; overflow: hidden; border-radius: 3px; border: 1px solid var(--line); background: var(--hover); }
.cover img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
.card:hover .cover img { transform: scale(1.03); }
.cover.ph { display: flex; align-items: flex-end; padding: 14px; color: #fff; border-color: transparent; }
.cover.ph span { font: 500 0.85rem var(--mono); letter-spacing: 0.04em; opacity: 0.92; }
.heart { position: absolute; top: 8px; right: 8px; background: rgb(8 12 11 / 0.55); color: #fff; border-radius: 999px; width: 28px; height: 28px; display: grid; place-items: center; font-size: 0.95rem; }
.card p { margin: 0; }
.card .place { color: var(--ink-2); }
.card .mono { margin-top: 2px; }
.tagline { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.tagline span { font: 500 0.72rem var(--mono); color: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }

.timeline { position: relative; display: flex; flex-direction: column; gap: 28px; padding-left: 22px; border-left: 2px solid var(--line); margin-left: 6px; }
.tl-item { position: relative; display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 20px; align-items: start; }
.tl-item::before { content: ""; position: absolute; left: -30px; top: 8px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 3px solid var(--bg); }
.tl-item .body { min-width: 0; display: grid; gap: 4px; }
.tl-item .body p { margin: 0; color: var(--ink-2); max-width: 60ch; overflow-wrap: anywhere; }
.tl-item .body .clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

.memory { border: 1px solid var(--line); border-left: 4px solid var(--blue); background: var(--surface); border-radius: 4px; padding: 14px 16px; margin-bottom: 26px; display: grid; gap: 10px; }
.memory h2 { font: 600 1.05rem var(--display); margin: 0; }
.memory .thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
.memory .thumbs button { width: 84px; height: 64px; padding: 0; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; cursor: pointer; background: var(--hover); }
.memory .thumbs img { width: 100%; height: 100%; object-fit: cover; }

.empty { border: 1px dashed var(--ink-2); border-radius: 4px; padding: 44px 24px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; max-width: 680px; }
.empty h2 { font: 600 1.6rem/1.15 var(--display); margin: 0; text-wrap: balance; }
.empty p { margin: 0; color: var(--ink-2); max-width: 54ch; }

/* mapa */
.mapbox { position: relative; width: 100%; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--sea); user-select: none; -webkit-user-select: none; }
.mapbox svg { display: block; width: 100%; height: auto; touch-action: pan-y; cursor: default; }
.mapbox.zoomed svg { touch-action: none; cursor: grab; }
.mapbox.dragging svg { cursor: grabbing; }
.mapbox.pick svg { cursor: crosshair; }
.mapctl { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 6px; }
.mapctl button { width: 38px; height: 38px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 4px; cursor: pointer; font: 600 1.1rem var(--body); }
.mapctl button:hover { background: var(--hover); }
.pin { cursor: pointer; }
.pin:focus-visible { outline: none; }
.pin:focus-visible circle.ring { stroke: var(--blue); stroke-width: 3; }
.mapnote { display: grid; gap: 18px; margin-top: 18px; }
.sel { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; align-items: center; border: 1px solid var(--line); border-radius: 4px; padding: 12px; background: var(--surface); }
.sel .cover { aspect-ratio: 4 / 3; }
.sel > div { min-width: 0; display: grid; gap: 4px; justify-items: start; }
.sel p { margin: 0; }
.nolocs { color: var(--ink-2); font-size: 0.95rem; }
.nolocs button { background: none; border: 0; border-bottom: 1px solid var(--ink-2); padding: 0; cursor: pointer; color: var(--ink); }

/* ano */
.yearbar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.yearbar h2 { font: 700 2rem/1 var(--display); margin: 0; min-width: 4ch; text-align: center; }
.months { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 24px 20px; }
.month h3 { font: 500 0.8rem var(--mono); letter-spacing: 0.06em; color: var(--ink-2); text-transform: uppercase; margin: 0 0 8px; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal .wd { font: 500 0.65rem var(--mono); color: var(--ink-2); text-align: center; }
.cal .d { aspect-ratio: 1; display: grid; place-items: center; font: 400 0.72rem var(--mono); border-radius: 3px; color: var(--ink-2); border: 0; background: transparent; padding: 0; }
.cal button.d { cursor: pointer; color: #fff; font-weight: 500; }
.cal button.d:hover { filter: brightness(1.12); }
.legend { margin-top: 26px; display: grid; gap: 8px; }
.legend button { display: flex; gap: 12px; align-items: baseline; background: none; border: 0; padding: 6px 0; text-align: left; cursor: pointer; border-bottom: 1px solid var(--line); }
.legend i { width: 12px; height: 12px; border-radius: 3px; flex: none; transform: translateY(1px); }

/* fotos */
.wall { column-width: 210px; column-gap: 14px; }
.wall figure { break-inside: avoid; margin: 0 0 14px; position: relative; }
.photo { display: block; width: 100%; padding: 0; border: 1px solid var(--line); border-radius: 3px; background: var(--hover); cursor: zoom-in; overflow: hidden; }
.photo img { width: 100%; height: auto; }
.wall figcaption { font: 400 0.8rem/1.35 var(--mono); color: var(--ink-2); padding-top: 6px; overflow-wrap: anywhere; }
.wall .heart { pointer-events: none; }
.month-h { font: 500 0.85rem var(--mono); letter-spacing: 0.06em; color: var(--ink-2); text-transform: uppercase; margin: 26px 0 12px; }
.month-h:first-child { margin-top: 0; }
.drop { border: 1px dashed var(--ink-2); border-radius: 4px; padding: 36px 20px; display: grid; gap: 12px; justify-items: start; max-width: 640px; }
.drop.over, .wall.over { outline: 2px dashed var(--blue); outline-offset: 6px; }
.drop p { margin: 0; color: var(--ink-2); }

/* viagem */
.back { background: none; border: 0; padding: 8px 0; cursor: pointer; font: 500 0.85rem var(--mono); color: var(--ink-2); margin-bottom: 14px; min-height: 44px; }
.back:hover { color: var(--ink); }
.trip-head { display: grid; gap: 14px; margin-bottom: 28px; }
.trip-head .where { font: 500 1.15rem var(--display); color: var(--ink-2); margin: 0; }
.trip-head .note { max-width: 62ch; margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.trip-mini { max-width: 640px; margin-bottom: 34px; }
.days { display: grid; gap: 34px; }
.day { display: grid; gap: 12px; }
.day-h { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.day-h b { font: 600 1.1rem var(--display); }
.day textarea { min-height: 72px; max-width: 70ch; }
.day .txt { margin: 0; max-width: 70ch; white-space: pre-wrap; overflow-wrap: anywhere; }
.day .wall { column-width: 160px; column-gap: 10px; }
.day .wall figure { margin-bottom: 10px; }
.day.empty-day { gap: 6px; }
.day.empty-day .day-h b { font: 500 0.95rem var(--display); color: var(--ink-2); }

.status {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  z-index: 90; max-width: calc(100% - 32px);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 4px;
  font: 500 0.85rem var(--mono); box-shadow: 0 6px 24px rgb(0 0 0 / 0.25);
}

/* janelas */
.backdrop {
  position: fixed; inset: 0; z-index: 60; background: var(--scrim); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.panel { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; width: 100%; max-width: 560px; max-height: 100%; overflow: auto; padding: 24px; }
.panel.wide { max-width: 720px; }
.panel h2 { font: 700 1.6rem/1.1 var(--display); margin: 0 0 18px; letter-spacing: -0.015em; }
.panel p.help { margin: 0 0 14px; color: var(--ink-2); font-size: 0.95rem; }
form { display: grid; gap: 14px; }
.f { display: grid; gap: 5px; min-width: 0; }
.f label { font: 500 0.78rem var(--mono); letter-spacing: 0.04em; color: var(--ink-2); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.err { color: var(--accent); font-size: 0.9rem; margin: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; margin-top: 6px; }
.locrow { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.proposal { border: 1px solid var(--line); border-radius: 4px; padding: 14px; display: grid; gap: 10px; margin-bottom: 12px; }
.proposal.off { opacity: 0.55; }
.proposal .head { display: flex; gap: 12px; align-items: center; }
.proposal .head input[type="checkbox"] { width: 20px; height: 20px; flex: none; }
.proposal .thumbs { display: flex; gap: 6px; overflow-x: auto; }
.proposal .thumbs img { width: 56px; height: 44px; object-fit: cover; border-radius: 3px; flex: none; border: 1px solid var(--line); }

/* visualizador de fotos */
.lb {
  position: fixed; inset: 0; z-index: 70; background: var(--scrim); color: var(--scrim-ink);
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.lb .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0; }
.lb .mono { color: var(--scrim-ink); opacity: 0.8; }
.lb .btn { border-color: var(--scrim-ink); color: var(--scrim-ink); }
.lb .btn:hover { background: rgb(255 255 255 / 0.12); }
.lb .btn.danger { border-color: #FF7456; color: #FF7456; }
.lb .btn[aria-pressed="true"] { background: var(--scrim-ink); color: #0b0f0e; }
.stage { position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.stage img { max-width: 100%; max-height: 100%; object-fit: contain; }
.nav { position: absolute; top: 50%; transform: translateY(-50%); min-width: 44px; padding-inline: 0; background: rgb(8 12 11 / 0.55); }
.nav.prev { left: 0; } .nav.next { right: 0; }
.lb .foot { display: grid; gap: 10px; max-width: 760px; width: 100%; margin: 0 auto; }
.lb .input { background: transparent; border-color: rgb(255 255 255 / 0.35); color: var(--scrim-ink); }
.lb .cap { margin: 0; min-height: 24px; text-align: center; overflow-wrap: anywhere; }
.lb .meta { text-align: center; margin: 0; }

/* modo discreto */
body.discreet .cover img, body.discreet .photo img, body.discreet .stage img, body.discreet .memory img, body.discreet .proposal img { filter: blur(16px); }
body.discreet .note, body.discreet .txt, body.discreet .day textarea, body.discreet figcaption { filter: blur(6px); }

/* livro */
.bk { position: fixed; inset: 0; z-index: 70; background: var(--scrim); color: var(--scrim-ink); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.bk .bar { margin: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.bk .mono { color: var(--scrim-ink); opacity: 0.8; }
.bk .btn { border-color: var(--scrim-ink); color: var(--scrim-ink); }
.bk .btn:hover { background: rgb(255 255 255 / 0.12); }
.bk .stagebox { min-height: 0; display: grid; place-items: center; overflow: hidden; }
.bk .stagebox .pg { width: min(100%, calc((100vh - 170px) * 1.4143)); }
.bk .foot { display: flex; gap: 12px; align-items: center; justify-content: center; }

/*BOOK-START*/
.pg { container-type: inline-size; position: relative; width: 100%; aspect-ratio: 297 / 210; background: #fff; color: #1a2321; overflow: hidden; font-family: "Source Sans 3", system-ui, "Segoe UI", sans-serif; font-size: 1.5cqw; line-height: 1.45; box-shadow: 0 8px 40px rgb(0 0 0 / 0.35); text-align: left; }
.pg * { box-sizing: border-box; }
.pg .mn { font-family: "DM Mono", ui-monospace, Menlo, monospace; font-size: 1.15cqw; letter-spacing: 0.04em; color: #5b6965; }
.pg h2 { font-family: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif; font-weight: 700; margin: 0; letter-spacing: -0.02em; line-height: 1.05; }
.pg.cover { color: #fff; }
.pg.cover img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.pg.cover .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgb(0 0 0 / 0.05) 35%, rgb(0 0 0 / 0.68)); }
.pg.cover .t { position: absolute; left: 5cqw; right: 5cqw; bottom: 5cqw; display: grid; gap: 1cqw; }
.pg.cover h2 { font-size: 8cqw; text-wrap: balance; }
.pg.cover .mn { color: rgb(255 255 255 / 0.9); font-size: 1.3cqw; }
.pg.cover .sub { font-size: 2.2cqw; margin: 0; opacity: 0.95; }
.pg.mp { display: grid; grid-template-columns: 30% 1fr; gap: 3cqw; padding: 4.5cqw; align-items: center; }
.pg.mp h2 { font-size: 3.6cqw; margin-bottom: 1.2cqw; }
.pg.mp .mapw { border: 1px solid #d5dad5; border-radius: 0.5cqw; overflow: hidden; align-self: stretch; display: grid; }
.pg.mp .mapw svg { width: 100%; height: 100%; display: block; }
.pg.day { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 1.6cqw; padding: 3.2cqw; }
.pg.day .hd { display: flex; align-items: baseline; gap: 1.4cqw; }
.pg.day .hd b { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 2.2cqw; }
.pg.day .bd { display: grid; grid-template-columns: 1fr; gap: 2.4cqw; min-height: 0; }
.pg.day.has-txt .bd { grid-template-columns: 34% minmax(0, 1fr); }
.pg.day .tx { white-space: pre-wrap; overflow: hidden; font-size: 1.75cqw; line-height: 1.5; overflow-wrap: anywhere; }
.pg.day.only-txt .bd { grid-template-columns: minmax(0, 1fr); }
.pg.day.only-txt .tx { font-size: 2.3cqw; max-width: 70%; }
.pg .ph { display: grid; gap: 1cqw; min-height: 0; min-width: 0; }
.pg .ph img { width: 100%; height: 100%; object-fit: cover; display: block; min-height: 0; min-width: 0; border-radius: 0.3cqw; }
.pg .ph.l2h { grid-template-columns: 1fr 1fr; }
.pg .ph.l2v { grid-template-rows: 1fr 1fr; }
.pg .ph.l3 { grid-template-columns: 1.5fr 1fr; grid-template-rows: 1fr 1fr; }
.pg .ph.l3 img:first-child { grid-row: 1 / 3; }
.pg .ph.l4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

const DEG = Math.PI / 180;
const MAP_W = 1000, LAT_TOP = 84, LAT_BOT = -58;

/* Projeção Natural Earth 1 */
function neX(lat, lon) {
  const p = lat * DEG, p2 = p * p, p4 = p2 * p2;
  return lon * DEG * (0.8707 - 0.131979 * p2 + p4 * (-0.013791 + p4 * (0.003971 * p2 - 0.001529 * p4)));
}
function neY(lat) {
  const p = lat * DEG, p2 = p * p, p4 = p2 * p2;
  return p * (1.007226 + p2 * (0.015085 + p4 * (-0.044475 + 0.028874 * p2 - 0.005916 * p4)));
}
const MAP_K = MAP_W / (2 * neX(0, 180));
const MAP_YTOP = MAP_K * neY(LAT_TOP);
const MAP_H = MAP_K * (neY(LAT_TOP) - neY(LAT_BOT));
function project(lon, lat) {
  return [MAP_W / 2 + MAP_K * neX(lat, lon), MAP_YTOP - MAP_K * neY(lat)];
}
function unproject(px, py) {
  const y = (MAP_YTOP - py) / MAP_K, x = (px - MAP_W / 2) / MAP_K;
  let p = y;
  for (let i = 0; i < 40; i++) {
    const p2 = p * p, p6 = p2 * p2 * p2, p8 = p6 * p2, p10 = p8 * p2, p11 = p10 * p;
    const f = 1.007226 * p + 0.015085 * p2 * p - 0.044475 * p6 * p + 0.028874 * p8 * p - 0.005916 * p11 - y;
    const d = 1.007226 + 0.045255 * p2 - 0.311325 * p6 + 0.259866 * p8 - 0.065076 * p10;
    const step = f / d; p -= step;
    if (Math.abs(step) < 1e-12) break;
  }
  const p2 = p * p, p4 = p2 * p2;
  const fx = 0.8707 - 0.131979 * p2 + p4 * (-0.013791 + p4 * (0.003971 * p2 - 0.001529 * p4));
  const lat = Math.max(-90, Math.min(90, p / DEG));
  const lon = Math.max(-180, Math.min(180, x / fx / DEG));
  return [lon, lat];
}
function haversineKm(la1, lo1, la2, lo2) {
  const dLa = (la2 - la1) * DEG, dLo = (lo2 - lo1) * DEG;
  const a = Math.sin(dLa / 2) ** 2 + Math.cos(la1 * DEG) * Math.cos(la2 * DEG) * Math.sin(dLo / 2) ** 2;
  return 12742 * Math.asin(Math.min(1, Math.sqrt(a)));
}

/* Datas (sempre 'YYYY-MM-DD', sem fuso) */
const pad2 = n => String(n).padStart(2, '0');
function parseYmd(s) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s || '')) return null;
  const [y, m, d] = s.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  return (dt.getUTCFullYear() === y && dt.getUTCMonth() === m - 1 && dt.getUTCDate() === d) ? dt : null;
}
const fmtYmd = dt => `${dt.getUTCFullYear()}-${pad2(dt.getUTCMonth() + 1)}-${pad2(dt.getUTCDate())}`;
function addDays(s, n) { const d = parseYmd(s); d.setUTCDate(d.getUTCDate() + n); return fmtYmd(d); }
function diffDays(a, b) { return Math.round((parseYmd(b) - parseYmd(a)) / 864e5); }
function localYmd(date) { return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`; }

/* EXIF (JPEG): data e GPS */
function parseExif(buf) {
  try {
    const v = new DataView(buf);
    if (v.byteLength < 12 || v.getUint16(0) !== 0xFFD8) return null;
    let o = 2;
    while (o + 4 < v.byteLength) {
      const mk = v.getUint16(o);
      if ((mk & 0xFF00) !== 0xFF00 || mk === 0xFFDA) break;
      const len = v.getUint16(o + 2);
      if (mk === 0xFFE1 && v.getUint32(o + 4) === 0x45786966 && v.getUint16(o + 8) === 0) {
        return readTiff(v, o + 10, Math.min(o + 2 + len, v.byteLength));
      }
      o += 2 + len;
    }
  } catch (e) { /* sem EXIF legível */ }
  return null;
}
function readTiff(v, base, end) {
  const bo = v.getUint16(base);
  if (bo !== 0x4949 && bo !== 0x4D4D) return null;
  const le = bo === 0x4949;
  const u16 = p => v.getUint16(p, le), u32 = p => v.getUint32(p, le);
  const SZ = { 1: 1, 2: 1, 3: 2, 4: 4, 5: 8, 7: 1, 9: 4, 10: 8 };

    if (off < base || off + 2 > end) return out;
    const n = u16(off);

      if (e + 12 > end) break;
      const tag = u16(e), type = u16(e + 2), count = u32(e + 4);
      const size = (SZ[type] || 1) * count;
      const at = size > 4 ? base + u32(e + 8) : e + 8;
      if (at + size > end) continue;
      out[tag] = { type, count, at };

  const la = rats(gps[2]), lo = rats(gps[4]);
  if (la.length === 3 && lo.length === 3) {
    let lat = la[0] + la[1] / 60 + la[2] / 3600, lng = lo[0] + lo[1] / 60 + lo[2] / 3600;
    if (ascii(gps[1]).toUpperCase().startsWith('S')) lat = -lat;
    if (ascii(gps[3]).toUpperCase().startsWith('W')) lng = -lng;
    if (isFinite(lat) && isFinite(lng) && (lat !== 0 || lng !== 0) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180) { res.lat = lat; res.lng = lng; }
  }
  return res;
}

const COUNTRIES = COUNTRY_ROWS.split('\n').map(r => {
  const [code, name, lat, lng, c] = r.split('|');
  return { code, name, lat: +lat, lng: +lng, cont: c };
});
const COUNTRY_BY_CODE = Object.fromEntries(COUNTRIES.map(c => [c.code, c]));
const normKey = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z]/g, '');
const COUNTRY_BY_KEY = {};
for (const c of COUNTRIES) COUNTRY_BY_KEY[normKey(c.name)] = c.code;
for (const [k, code] of Object.entries(COUNTRY_ALIASES)) if (!COUNTRY_BY_KEY[k]) COUNTRY_BY_KEY[k] = code;
function findCountry(text) {
  const k = normKey(text);
  if (!k) return null;
  const code = COUNTRY_BY_KEY[k];
  return code ? COUNTRY_BY_CODE[code] : null;
}
const MICRO = new Set(['VA', 'SM', 'MC', 'LI', 'AD']);
function nearestCountry(lat, lng) {
  let best = null, bd = Infinity;
  for (const c of COUNTRIES) {
    if (MICRO.has(c.code)) continue; const d = haversineKm(lat, lng, c.lat, c.lng); if (d < bd) { bd = d; best = c; } }
  return best;
}

/* Localização de uma viagem: coordenadas guardadas, GPS das fotos ou centro do país */
function tripPoint(t) {
  if (Number.isFinite(t.lat) && Number.isFinite(t.lng)) return { lat: t.lat, lng: t.lng, src: 'manual' };
  const g = (t.photos || []).filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lng));
  if (g.length) return { lat: median(g.map(p => p.lat)), lng: median(g.map(p => p.lng)), src: 'fotos' };

}

  const a = parseYmd(t.start), b = parseYmd(t.end);

  return Math.round((b - a) / 864e5) + 1;

/* Agrupa fotos em viagens: nova viagem quando há mais de gapDays dias entre fotos seguidas */
function groupByDate(items, gapDays) {
  const s = items.slice().sort((a, b) => (a.date + ' ' + (a.time || '')).localeCompare(b.date + ' ' + (b.time || '')));
  const groups = [];
  for (const it of s) {
    const g = groups[groups.length - 1];
    if (g && diffDays(g.end, it.date) <= gapDays) { g.items.push(it); if (it.date > g.end) g.end = it.date; }
    else groups.push({ start: it.date, end: it.date, items: [it] });
  }
  return groups;
}

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function polyPath(str) {
  const pts = str.split(' ').map(p => { const [lo, la] = p.split(',').map(Number); return project(lo, la); });

  for (let la = -30; la <= 60; la += 30) { const a = project(-180, la), b = project(180, la); d += `M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${b[0].toFixed(1)} ${b[1].toFixed(1)}`; }

const LAND_D = LAND.map(polyPath).join('');
const SEA_D = SEAS.map(polyPath).join('');
const BOOK_PAL = { sea: '#E1E9E7', land: '#FFFFFF', coast: '#A5B5B1', grat: '#CFDAD7', pin: '#C8341B', dot: '#1F3F9E', route: '#1F3F9E' };

function fitView(points, minW) {
  if (!points.length) return { x: 0, y: 0, w: MAP_W };
  const xs = points.map(p => project(p.lng, p.lat)[0]), ys = points.map(p => project(p.lng, p.lat)[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const w = Math.min(MAP_W, Math.max(minW || 220, (x1 - x0) * 1.5, (y1 - y0) * 1.5 * MAP_W / MAP_H));
  const hh = w * MAP_H / MAP_W;
  return { x: Math.max(0, Math.min(MAP_W - w, (x0 + x1) / 2 - w / 2)), y: Math.max(0, Math.min(MAP_H - hh, (y0 + y1) / 2 - hh / 2)), w };
}

function createMap(o) {
  const pal = o.palette || null;
  const col = (k, v) => pal ? pal[k] : `var(--${v})`;
  const svg = svgEl('svg', { viewBox: `0 0 ${MAP_W} ${MAP_H}`, role: 'img', 'aria-label': o.label || 'Mapa-múndi', xmlns: SVGNS });
  svg.append(
    svgEl('rect', { x: 0, y: 0, width: MAP_W, height: MAP_H, fill: col('sea', 'sea') }),
    svgEl('path', { d: GRAT_D, fill: 'none', stroke: col('grat', 'grat'), 'stroke-width': 1, 'vector-effect': 'non-scaling-stroke' }),
    svgEl('path', { d: LAND_D, fill: col('land', 'land'), stroke: col('coast', 'coast'), 'stroke-width': 1, 'stroke-linejoin': 'round', 'vector-effect': 'non-scaling-stroke' }),
    svgEl('path', { d: SEA_D, fill: col('sea', 'sea'), stroke: col('coast', 'coast'), 'stroke-width': 1, 'vector-effect': 'non-scaling-stroke' }));
  const gRoute = svgEl('g'), gDots = svgEl('g'), gPins = svgEl('g'), gPick = svgEl('g');
  svg.append(gRoute, gDots, gPins, gPick);

  const pins = o.pins || [];
  if (o.route && pins.length > 1) {
    const d = pins.map((p, i) => { const q = project(p.lng, p.lat); return (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1); }).join('');
    gRoute.append(svgEl('path', { d, fill: 'none', stroke: col('route', 'blue'), 'stroke-width': 1.6, 'stroke-dasharray': '6 5', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: 0.85, 'vector-effect': 'non-scaling-stroke' }));
  }
  const scaled = [];
  for (const d of (o.dots || [])) {
    const q = project(d.lng, d.lat);
    const g = svgEl('g', { transform: `translate(${q[0].toFixed(1)} ${q[1].toFixed(1)})` });
    g.append(svgEl('circle', { r: 3.5, fill: col('dot', 'blue'), stroke: pal ? '#fff' : 'var(--surface)', 'stroke-width': 1 }));
    gDots.append(g); scaled.push([g, q]);
  }
  for (const p of pins) {
    const q = project(p.lng, p.lat);
    const g = svgEl('g', { class: 'pin', transform: `translate(${q[0].toFixed(1)} ${q[1].toFixed(1)})`, 'data-id': p.id });
    if (!o.static) { g.setAttribute('tabindex', '0'); g.setAttribute('role', 'button'); g.setAttribute('aria-label', p.label || 'Viagem'); }
    if (p.label && !o.static) g.append(svgEl('title', {}, document.createTextNode(p.label)));
    g.append(svgEl('circle', { class: 'ring', r: p.sel ? 13 : 10, fill: 'none', stroke: p.sel ? col('route', 'blue') : 'none', 'stroke-width': 2.5 }));
    g.append(svgEl('circle', { r: 7, fill: col('pin', 'accent'), stroke: pal ? '#fff' : 'var(--surface)', 'stroke-width': 2.5 }));
    if (!o.static) {
      g.addEventListener('pointerdown', e => e.stopPropagation());
      g.addEventListener('click', e => { e.stopPropagation(); o.onPin && o.onPin(p.id); });
      g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); o.onPin && o.onPin(p.id); } });
    }
    gPins.append(g); scaled.push([g, q]);
  }

  let { x: vx, y: vy, w: vw } = o.view || { x: 0, y: 0, w: MAP_W };
  const box = h('div', { class: 'mapbox' + (o.onPick ? ' pick' : '') });
  const vh = () => vw * MAP_H / MAP_W;
  const clampView = () => { vw = Math.max(50, Math.min(MAP_W, vw)); vx = Math.max(0, Math.min(MAP_W - vw, vx)); vy = Math.max(0, Math.min(MAP_H - vh(), vy)); };

    const k = (o.static ? vw / 900 : vw / widthPx());
    for (const [g, q] of scaled) g.setAttribute('transform', `translate(${q[0].toFixed(1)} ${q[1].toFixed(1)}) scale(${k.toFixed(4)})`);
    box.classList.toggle('zoomed', vw < MAP_W - 1);

  }

      h('button', { type: 'button', 'aria-label': 'Afastar', onclick: () => zoom(1.67) }, '−'),
      h('button', { type: 'button', 'aria-label': 'Ver o mundo todo', onclick: () => { vx = 0; vy = 0; vw = MAP_W; apply(); } }, '⟲')));
    let drag = null;

  const photos = trips.reduce((n, t) => n + (t.photos || []).length, 0);

  const parts = [pl(trips.length, 'viagem', 'viagens')];

}

async function prepare(file) {
  if (file.type === 'image/gif') return { blob: file, w: 0, h: 0 };

    const bmp = await createImageBitmap(file);
    const max = 2400, w0 = bmp.width, h0 = bmp.height;
    const s = Math.min(1, max / Math.max(w0, h0));
    if (s === 1 && file.type === 'image/jpeg' && file.size < 3e6) { bmp.close && bmp.close(); return { blob: file, w: w0, h: h0 }; }
    const w = Math.round(w0 * s), hh = Math.round(h0 * s);

    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, hh);
    ctx.drawImage(bmp, 0, 0, w, hh);
    bmp.close && bmp.close();
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.86));
    if (blob) return { blob, w, h: hh };
  } catch (e) { /* tenta o original */ }
  if (['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) return { blob: file, w: 0, h: 0 };
  throw { code: 'unsupported_type' };
}

  const hasTxt = !!pg.text, solo = pg.solo;
  const ph = pg.photos.length ? `<div class="ph ${layoutOf(pg.photos)}">${pg.photos.map(p => `<img src="${esc(ctx.src(p.id))}" alt="${esc(p.caption || '')}">`).join('')}</div>` : '';
  return `<div class="pg day${hasTxt && !solo ? ' has-txt' : ''}${solo ? ' only-txt' : ''}"><div class="hd">${label}</div><div class="bd">${hasTxt ? `<div class="tx">${esc(pg.text)}</div>` : ''}${ph}</div></div>`;
}
function openBook(tid) {
  const t = tripById(tid); if (!t) return;
  lastFocus = document.activeElement;
  bk = { tid, i: 0, pages: bookPages(t), map: mapSVGString(t), el: null };
  lockScroll(); drawBook();
}
function closeBook() {
  if (!bk) return;
  bk.el && bk.el.remove(); bk = null; unlockScroll();
  lastFocus && lastFocus.focus && lastFocus.focus();
}
function bkStep(d) { if (!bk) return; bk.i = Math.max(0, Math.min(bk.pages.length - 1, bk.i + d)); drawBook(); }
function drawBook() {
  if (!bk) return;
  const t = tripById(bk.tid);
  if (!t) { closeBook(); return; }
  const stage = h('div', { class: 'stagebox' });
  stage.innerHTML = pageHTML(bk.pages[bk.i], t, { src: blobUrl, mapSVG: bk.map });
  const el = h('div', { class: 'bk', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Livro: ' + t.title },
    h('div', { class: 'bar' }, h('span', { class: 'mono' }, `${t.title}  ·  página ${bk.i + 1} de ${bk.pages.length}`),
      h('div', { class: 'row' },
        downloads ? h('button', { class: 'btn sm', type: 'button', onclick: () => exportBook(t.id) }, 'Exportar') : null,
        h('button', { class: 'btn sm', type: 'button', id: 'bk-close', onclick: closeBook }, 'Fechar'))),
    stage,
    h('div', { class: 'foot' },
      h('button', { class: 'btn', type: 'button', disabled: bk.i === 0, onclick: () => bkStep(-1) }, '← Anterior'),
      h('button', { class: 'btn', type: 'button', disabled: bk.i === bk.pages.length - 1, onclick: () => bkStep(1) }, 'Seguinte →')));
  bk.el && bk.el.remove();
  bk.el = el; document.body.append(el);
  $('#bk-close', el).focus();
}
async function toDataUrl(id, max) {
  const r = await fetch(blobUrl(id));
  if (!r.ok) throw new Error('foto');
  const bmp = await createImageBitmap(await r.blob());
  const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  bmp.close && bmp.close();
  return c.toDataURL('image/jpeg', 0.82);
}
let exporting = false;
async function exportBook(tid) {
  const t = tripById(tid);
  if (!t || !downloads || exporting) return;
  exporting = true;
  try {
    const pages = bookPages(t), ids = [...new Set(pages.flatMap(p => p.k === 'cover' ? [coverId(t)].filter(Boolean) : (p.photos || []).map(x => x.id)))];
    const cache = new Map();
    for (let i = 0; i < ids.length; i++) {
      setStatus(`A preparar o livro: foto ${i + 1} de ${ids.length}…`);
      try { cache.set(ids[i], await toDataUrl(ids[i], 1600)); } catch (e) { cache.set(ids[i], ''); }
    }
    const ctx = { src: id => cache.get(id) || '', mapSVG: mapSVGString(t) };
    const css = '@page{size:297mm 210mm;margin:0}*{box-sizing:border-box}body{margin:0;background:#cfd6d3;font-family:"Source Sans 3",system-ui,sans-serif;padding:24px 0}.note{max-width:880px;margin:0 auto 20px;padding:0 16px;font-size:14px;color:#33413d}.pg{width:min(100%,1100px);margin:0 auto 24px}@media print{body{background:#fff;padding:0}.note{display:none}.pg{width:297mm;height:210mm;margin:0;box-shadow:none;break-after:page;page-break-after:always}}';
    const html = `<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(t.title)}</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Source+Sans+3:wght@400;600&family=DM+Mono:wght@400;500&display=swap"><style>${BOOK_CSS}${css}</style></head><body><p class="note">Livro de viagem: ${esc(t.title)}. Para obter um PDF ou imprimir, usa Imprimir no navegador e escolhe "Guardar como PDF" com margens a zero e gráficos de fundo ativos.</p>${pages.map(p => pageHTML(p, t, ctx)).join('\n')}</body></html>`;
    setStatus('A preparar o ficheiro…');
    await downloads.save({ filename: slug(t.title) + '-livro.html', data: new Blob([html], { type: 'text/html' }) });
    setStatus('Livro guardado.', 3000);
  } catch (e) {
    setStatus(e && e.code === 'declined' ? null : 'Não foi possível guardar o livro.', 4000);
  } finally { exporting = false; }
}

/* ---------- teclado ---------- */
document.addEventListener('keydown', e => {
  const typing = document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName);
  if (e.key === 'Escape') { if (modal) { if (!uploading) closeModal(); } else if (bk) closeBook(); else if (lb) closeLightbox(); }
  else if (!modal && !typing) {
    if (lb) { if (e.key === 'ArrowLeft') lbStep(-1); else if (e.key === 'ArrowRight') lbStep(1); }
    else if (bk) { if (e.key === 'ArrowLeft') bkStep(-1); else if (e.key === 'ArrowRight') bkStep(1); }
  }
});

/* ---------- arranque ---------- */
async function init() {
  try { ui.discreet = !!localStorage.getItem('album-discreto'); } catch (e) { /* sem armazenamento */ }
  document.body.classList.toggle('discreet', ui.discreet);
  applyHash();
  const api = window.claude;
  const slowTimer = setTimeout(() => { if (!loaded) { slow = true; render(); } }, 10000);
  try { db = api && api.use ? await api.use('db') : null; } catch (e) { db = null; }
  if (!db) { clearTimeout(slowTimer); noDb = true; loaded = true; render(); return; }

  Promise.all([
    api.use('user').catch(() => null),
    api.use('assets').catch(() => null),
    api.use('downloads').catch(() => null)
  ]).then(([user, a, d]) => {
    assets = a || null; downloads = d || null;
    canWrite = user ? !!user.canEdit() : !!assets;
    render();
  });

  db.collection('trips').onSnapshot(snap => {
    clearTimeout(slowTimer); slow = false; loadError = false;
    const datas = snap.docs.map(d => d.data()), ids = snap.docs.map(d => d.id);
    const same = loaded && datas.length === lastDatas.length && datas.every((x, i) => x === lastDatas[i]) && ids.every((x, i) => x === lastIds[i]);
    lastDatas = datas; lastIds = ids;
    trips = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const first = !loaded; loaded = true;
    if (first) { const ys = trips.map(t => +(t.start || '').slice(0, 4)).filter(Boolean); if (ys.length) ui.year = Math.max(...ys); }
    if (!same || first) { render(); if (lb) drawLightbox(); if (bk) drawBook(); }
  }, () => { clearTimeout(slowTimer); loadError = true; loaded = true; render(); });
}
init();

</script>
